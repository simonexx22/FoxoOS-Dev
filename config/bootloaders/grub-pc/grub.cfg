source /boot/grub/config.cfg

# FoxoOS Live boot
menuentry "Uruchom FoxoOS Live" --hotkey=l {
	linux	/live/vmlinuz-6.12.117+deb13-amd64 boot=live components quiet live-config.noautologin live-config.hostname=foxoos live-config.username=foxos live-config.locales=pl_PL.UTF-8 live-config.timezone=Europe/Warsaw live-config.keyboard-layouts=pl live-config.keyboard-model=pc105 console=ttyS0,115200 console=tty0 findiso=${iso_path}
	initrd	/live/initrd.img-6.12.117+deb13-amd64
}

menuentry "Tryb awaryjny" --hotkey=f {
	linux	/live/vmlinuz-6.12.117+deb13-amd64 boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788 findiso=${iso_path}
	initrd	/live/initrd.img-6.12.117+deb13-amd64
}

submenu 'Narzędzia' --hotkey=n {

	source /boot/grub/theme.cfg

	# Verify medium integrity
	menuentry "Sprawdź spójność nośnika Live" --hotkey=s {
		linux	/live/vmlinuz-6.12.117+deb13-amd64 boot=live components live-config.noautologin live-config.hostname=foxoos live-config.username=foxos live-config.locales=pl_PL.UTF-8 live-config.timezone=Europe/Warsaw live-config.keyboard-layouts=pl live-config.keyboard-model=pc105 console=ttyS0,115200 console=tty0 findiso=${iso_path} verify-checksums
		initrd	/live/initrd.img-6.12.117+deb13-amd64
	}

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Ustawienia oprogramowania układowego UEFI" --hotkey=u {
			fwsetup
		}
	fi

	menuentry "Powrót do menu głównego" --hotkey=b {
		source /boot/grub/grub.cfg
	}
}
