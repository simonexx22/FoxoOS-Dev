set default=0

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod all_video
insmod video_bochs
insmod video_cirrus
insmod png
insmod gfxterm

set gfxmode=800x600,640x480,auto
set gfxpayload=keep

if [ -e /boot/grub/dejavu.pf2 ]; then
    loadfont /boot/grub/dejavu.pf2
fi
if [ -e /boot/grub/fonts/dejavu.pf2 ]; then
    loadfont /boot/grub/fonts/dejavu.pf2
fi
if [ -e /boot/grub/unicode.pf2 ]; then
    loadfont /boot/grub/unicode.pf2
fi
if [ -e /boot/grub/fonts/unicode.pf2 ]; then
    loadfont /boot/grub/fonts/unicode.pf2
fi

source /boot/grub/theme.cfg

terminal_output gfxterm

# FoxoOS: automatic boot timeout and serial console support
set timeout=5
set timeout_style=menu
if serial --unit=0 --speed=115200 2>/dev/null; then
	terminal_input --append serial
	terminal_output --append serial
fi
