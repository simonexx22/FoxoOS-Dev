[greeter]
background = /usr/share/wallpapers/foxoos/wallpapermain.png
default-user-image = /usr/share/icons/foxoos/logosystemu.png
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
font-name = Sans 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~layout;~session;~power
clock-format = %a, %d %b  %H:%M
user-background = false
round-user-image = true
highlight-logged-user = true
