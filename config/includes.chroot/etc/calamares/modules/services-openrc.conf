---
initdDir: "/etc/init.d"
runlevelsDir: "/etc/runlevels"
services:
  - name: "udev"
    runlevel: "sysinit"
  - name: "dbus"
    runlevel: "default"
  - name: "network-manager"
    runlevel: "default"
  - name: "rsyslog"
    runlevel: "default"
  - name: "elogind"
    runlevel: "default"
  - name: "lightdm"
    runlevel: "default"
